server {
    listen 80;

    server_name localhost;


    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }


    location = /api/users/health {
        proxy_pass http://user-service:8000/health;
    }


    location = /api/products/health {
        proxy_pass http://product-service:8001/health;
    }


    location /api/users/ {
        proxy_pass http://user-service:8000/users/;
    }


    location /api/products/ {
        proxy_pass http://product-service:8001/products/;
    }
}
